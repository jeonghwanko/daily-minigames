<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>싫어하는 음식 피하기 🙅 | 데일리 미니게임</title>
<meta name="description" content="싫어하는 음식: ___ 너의 답은? 쏟아지는 음식 중 싫어하는 음식만 피해서 식판을 채워라. 45초 편식 챌린지">
<meta property="og:title" content="싫어하는 음식 피하기 🙅 45초 편식 챌린지">
<meta property="og:description" content="고수? 오이? 가지? 내 싫어하는 음식만 피해서 식판 채우기">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fff4e0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#2b2118;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:800;font-size:17px;background:#ffd89a;z-index:3}
#hud .hate{font-size:14px;background:#fff;border-radius:999px;padding:3px 10px}
#mute{background:none;border:0;font-size:22px;cursor:pointer}
#field{position:relative;flex:1;overflow:hidden;background:repeating-linear-gradient(90deg,#fff4e0 0 40px,#fff0d4 40px 80px);touch-action:none}
.f{position:absolute;top:0;left:0;font-size:44px;line-height:1;will-change:transform;pointer-events:none}
#tray{position:absolute;bottom:18px;left:0;width:120px;height:46px;will-change:transform;pointer-events:none}
#tray .plate{position:absolute;inset:0;background:#c9d1d9;border-radius:10px 10px 22px 22px;box-shadow:inset 0 -6px 0 #a7b0ba,0 4px 8px rgba(0,0,0,.2)}
#tray .face{position:absolute;left:50%;top:-44px;transform:translateX(-50%);font-size:40px}
#stack{position:absolute;left:8px;right:8px;top:4px;font-size:14px;text-align:center;letter-spacing:-2px;overflow:hidden;white-space:nowrap}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 #fff;opacity:0;transition:opacity .15s;pointer-events:none;z-index:4}
#hint{position:absolute;left:0;right:0;bottom:72px;text-align:center;font-size:13px;opacity:.5;pointer-events:none}
.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(255,246,230,.97)}
.overlay.hidden{display:none}
.overlay h1{font-size:28px;margin:8px 0 6px}
.overlay p{line-height:1.55;margin:6px 0;word-break:keep-all}
.big{font-size:74px}
.card{background:#fff;border-radius:16px;padding:12px 16px;margin:8px 0;box-shadow:0 3px 0 #f0d6aa;font-size:15px;text-align:left;width:100%;max-width:300px}
#picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;width:100%;max-width:330px}
.pick{border:3px solid transparent;background:#fff;border-radius:14px;padding:8px 2px;font-size:30px;cursor:pointer;box-shadow:0 3px 0 #f0d6aa}
.pick small{display:block;font-size:12px;font-weight:800;color:#5a4636}
.pick.on{border-color:#e53935;background:#ffecec}
.btn{display:inline-block;margin:8px 6px;padding:14px 22px;border-radius:999px;border:0;font-size:18px;font-weight:800;cursor:pointer;background:#ff7a00;color:#fff}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:#ff7a00;border:2px solid #ff7a00}
.score{font-size:52px;font-weight:900;color:#ff7a00;margin:4px 0}
.small{font-size:13px;opacity:.7;margin-top:12px}
.small a{color:#b45309}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="time">⏱ 45</span><span id="score">0점</span><span class="hate" id="hateTag">🙅 -</span><span id="hearts">❤️❤️❤️</span><button id="mute" aria-label="소리 켜기">🔇</button></div>
  <div id="field">
    <div id="tray"><div class="face" id="face">😋</div><div class="plate"><div id="stack"></div></div></div>
    <div id="hint">← 좌우로 끌어서 식판 이동 →</div>
    <div id="msg"></div>
  </div>

  <div class="overlay" id="start">
    <div class="big">🍱</div>
    <h1>싫어하는 음식 피하기</h1>
    <div class="card">좋아하는 음식: 다 좋아<br><b>싫어하는 음식: <span id="pickedName" style="color:#e53935">???</span></b></div>
    <p>요즘 타임라인 프로필 질문 그거! 먼저 <b>내 싫어하는 음식</b>을 골라요.</p>
    <div id="picks"></div>
    <p style="font-size:14px">식판을 좌우로 끌어서 맛있는 건 받고<br>싫어하는 음식이 담기면 ❤️ -1 · 45초</p>
    <button class="btn" id="startBtn">탭해서 시작 (안 고르면 랜덤)</button>
    <p class="small"><a href="../../../">← 다른 미니게임 보기</a></p>
  </div>

  <div class="overlay hidden" id="result">
    <div class="big" id="rEmoji">😋</div>
    <h1 id="rTitle">편식왕</h1>
    <div class="score" id="rScore">0점</div>
    <p id="rDetail"></p>
    <div class="card" id="rCard"></div>
    <div><button class="btn" id="shareBtn">📤 결과 공유하기</button></div>
    <div><button class="btn ghost" id="retryBtn">🔁 다시 하기</button> <button class="btn ghost" id="changeBtn">🙅 음식 바꾸기</button></div>
    <p class="small">#본트친은다하세요 ‘싫어하는 음식’ 유행 기념 원작 미니게임 · <a href="../../../">다른 게임 보기</a></p>
  </div>
  <div id="toast"></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const ROUND=Math.max(1,Math.min(120,Number(qs.get('dur'))||45));
const PLAY_URL=location.origin+location.pathname;
const HATES=[{e:'🥒',n:'오이'},{e:'🌿',n:'고수'},{e:'🍆',n:'가지'},{e:'🫑',n:'피망'},{e:'🍄',n:'버섯'},{e:'🥕',n:'당근'},{e:'🧅',n:'양파'},{e:'🦑',n:'오징어'}];
const GOOD=['🍗','🍕','🍜','🍙','🍰','🍟','🍩','🍣','🥟','🍖','🍤','🍦','🧇','🍛','🍔','🍓'];
let hate=null,st='ready',score=0,hearts=3,caught=0,dodged=0,eaten=0,combo=0,best=0,timeLeft=ROUND,elapsed=0,lastTs=0,spawnT=0,foods=[],trayX=0,targetX=null,stackArr=[];
let muted=true,ac=null;
function beep(f,d=0.08,type='sine',v=0.07){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.stop(ac.currentTime+d+0.02)}catch(e){}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'소리 켜기':'소리 끄기');beep(660)};
function toast(t){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.opacity=0,1800)}
function msg(t,c){const m=$('msg');m.textContent=t;m.style.color=c||'#2b2118';m.style.opacity=1;clearTimeout(msg._t);msg._t=setTimeout(()=>m.style.opacity=0,600)}
function hud(){$('time').textContent='⏱ '+Math.ceil(timeLeft);$('score').textContent=score+'점';$('hearts').textContent='❤️'.repeat(Math.max(0,hearts))+'🤍'.repeat(3-Math.max(0,hearts));$('hateTag').textContent='🙅 '+(hate?hate.e+hate.n:'-')}
// picker
const P=$('picks');
HATES.forEach((h,i)=>{const b=document.createElement('button');b.className='pick';b.innerHTML=`${h.e}<small>${h.n}</small>`;b.addEventListener('click',e=>{e.stopPropagation();choose(i)});P.appendChild(b)});
function choose(i){hate=HATES[i];[...P.children].forEach((c,k)=>c.classList.toggle('on',k===i));$('pickedName').textContent=hate.e+' '+hate.n;hud();beep(520)}
// tray control
const field=$('field');
function fieldW(){return field.clientWidth}
function setTarget(clientX){const r=field.getBoundingClientRect();targetX=Math.max(0,Math.min(r.width-120,clientX-r.left-60))}
field.addEventListener('pointerdown',e=>{if(st!=='play')return;e.preventDefault();setTarget(e.clientX)});
field.addEventListener('pointermove',e=>{if(st!=='play')return;if(e.pointerType==='mouse'&&e.buttons===0){setTarget(e.clientX);return}setTarget(e.clientX)});
window.addEventListener('keydown',e=>{if(st!=='play')return;const W=fieldW();if(e.key==='ArrowLeft')targetX=Math.max(0,(targetX??trayX)-50);if(e.key==='ArrowRight')targetX=Math.min(W-120,(targetX??trayX)+50)});
function spawn(){
  const W=fieldW();
  const badP=Math.min(0.5,0.28+elapsed*0.006);
  const bad=Math.random()<badP;
  const el=document.createElement('div');el.className='f'+(bad?' bad':'');
  el.textContent=bad?hate.e:GOOD[Math.random()*GOOD.length|0];
  field.appendChild(el);
  const speed=150+elapsed*5+Math.random()*60;
  const f={el,bad,x:10+Math.random()*(W-60),y:-50,vy:speed,vx:0,wob:Math.random()*6};
  // 20초 이후엔 일부 음식이 옆으로 흔들리며 떨어짐
  if(elapsed>20&&Math.random()<0.35)f.vx=(Math.random()<0.5?-1:1)*(40+Math.random()*50);
  foods.push(f);
}
function loop(ts){
  if(st!=='play')return;
  const dt=Math.min(0.05,(ts-(lastTs||ts))/1000);lastTs=ts;
  timeLeft-=dt;elapsed+=dt;
  if(timeLeft<=0){timeLeft=0;hud();end();return}
  const W=fieldW(),H=field.clientHeight;
  if(targetX!==null)trayX+=(targetX-trayX)*Math.min(1,dt*18);
  $('tray').style.transform=`translateX(${trayX}px)`;
  spawnT-=dt;if(spawnT<=0){spawnT=Math.max(0.32,0.85-elapsed*0.012);spawn()}
  const trayTop=H-18-46;
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i];f.y+=f.vy*dt;f.x+=f.vx*dt;if(f.x<0||f.x>W-48)f.vx*=-1;
    f.el.style.transform=`translate(${f.x}px,${f.y}px) rotate(${Math.sin(ts/200+f.wob)*12}deg)`;
    const cx=f.x+22;
    if(f.y+40>=trayTop&&f.y<trayTop+20&&cx>trayX&&cx<trayX+120){
      f.el.remove();foods.splice(i,1);
      if(f.bad){hearts--;combo=0;eaten++;$('face').textContent='🤢';msg('으악 '+hate.n+'!! 🤢','#e53935');beep(140,0.25,'sawtooth',0.06);if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}setTimeout(()=>{if(st==='play')$('face').textContent='😋'},600);if(hearts<=0){hud();end();return}}
      else{caught++;combo++;best=Math.max(best,combo);const pts=10*(1+Math.min(4,Math.floor(combo/5)));score+=pts;stackArr.push(f.el.textContent);if(stackArr.length>8)stackArr.shift();$('stack').textContent=stackArr.join('');$('face').textContent=combo>=10?'🤤':'😋';if(combo%5===0)msg('🔥'+combo+'콤보 냠냠','#ff7a00');beep(500+Math.min(combo,20)*25,0.06,'triangle')}
      continue;
    }
    if(f.y>H){if(f.bad){dodged++;score+=3}f.el.remove();foods.splice(i,1)}
  }
  hud();requestAnimationFrame(loop);
}
function start(){
  if(!hate)choose(Math.random()*HATES.length|0);
  foods.forEach(f=>f.el.remove());foods=[];stackArr=[];$('stack').textContent='';
  score=0;hearts=3;caught=0;dodged=0;eaten=0;combo=0;best=0;timeLeft=ROUND;elapsed=0;lastTs=0;spawnT=0.3;
  trayX=(fieldW()-120)/2;targetX=trayX;$('face').textContent='😋';
  $('start').classList.add('hidden');$('result').classList.add('hidden');
  st='play';hud();requestAnimationFrame(loop);beep(440);
}
function end(){
  if(st==='over')return;st='over';
  let t,e;
  if(hearts<=0){t=hate.n+'에게 패배…';e='🤢'}
  else if(score>=900){t='편식계의 전설';e='👑'}
  else if(score>=550){t='급식실 프로 편식러';e='😎'}
  else if(score>=250){t='골라 먹기 중수';e='😋'}
  else{t='배고픈 편식러';e='🥲'}
  $('rTitle').textContent=t;$('rEmoji').textContent=e;$('rScore').textContent=score+'점';
  $('rDetail').textContent=`맛있는 거 ${caught}개 냠 · ${hate.n} ${dodged}개 피함 · ${hate.n} 먹음 ${eaten}번 · 최고 콤보 ${best}`;
  $('rCard').innerHTML='';const c=$('rCard');c.append('좋아하는 음식: '+(stackArr.slice(-3).join(' ')||'아직 없음'));c.appendChild(document.createElement('br'));const b=document.createElement('b');b.textContent='싫어하는 음식: '+hate.e+' '+hate.n+' (진짜 싫음 확인됨)';c.appendChild(b);
  $('result').classList.remove('hidden');
  window.__lastResult={score,caught,dodged,eaten,hate:hate.n};
}
async function share(){
  const text=`🙅 싫어하는 음식: ${hate.n} ${hate.e}\n${hate.n} 피해서 식판 ${score}점! (${$('rTitle').textContent}) 너의 싫어하는 음식은 뭐야?`;
  const full=text+'\n'+PLAY_URL;
  try{if(navigator.share){await navigator.share({title:'싫어하는 음식 피하기',text,url:PLAY_URL});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(full);toast('복사됐어요! 친구에게 붙여넣기 📋')}
  catch(e){const ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();let k=false;try{k=document.execCommand('copy')}catch(_){}ta.remove();toast(k?'복사됐어요! 📋':'주소를 직접 복사해 주세요: '+PLAY_URL)}
}
$('startBtn').addEventListener('click',e=>{e.stopPropagation();start()});
$('start').addEventListener('click',e=>{if(e.target.tagName!=='A'&&!e.target.closest('.pick')&&st==='ready')start()});
$('retryBtn').addEventListener('click',start);
$('changeBtn').addEventListener('click',()=>{st='ready';$('result').classList.add('hidden');$('start').classList.remove('hidden')});
$('shareBtn').addEventListener('click',share);
const pre=HATES.findIndex(h=>h.n===qs.get('hate'));if(pre>=0)choose(pre);
hud();
window.__game={get state(){return st},get score(){return score},pick:choose,get foods(){return foods},get trayX(){return trayX},set target(v){targetX=v},get hate(){return hate}};
})();
</script>
</body>
</html>
