<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>줄이어폰 엉킴 풀기 🎧 60초 챌린지 | 데일리 미니게임</title>
<meta name="description" content="다시 유행하는 줄이어폰, 근데 주머니에서 꺼내면 늘 엉켜있죠. 60초 안에 몇 개 풀 수 있나요?">
<meta property="og:title" content="줄이어폰 엉킴 풀기 🎧 60초 챌린지">
<meta property="og:description" content="엉킨 줄이어폰을 60초 안에 몇 개 풀 수 있을까?">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1d1b26;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#2a2638,#1d1b26)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:800;font-size:18px;background:rgba(0,0,0,.25)}
#mute{background:none;border:0;font-size:22px;color:#fff;cursor:pointer}
#info{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:14px;opacity:.95}
#info b{color:#ffb4c8}
#reroll{background:#3a3550;color:#fff;border:1px solid #6b6290;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
#wrap{position:relative;flex:1;margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:20px;overflow:hidden;background:repeating-linear-gradient(45deg,#3b3350 0 14px,#382f4c 14px 28px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.08)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:30px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .15s;pointer-events:none}
.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(22,20,32,.95)}
.overlay.hidden{display:none}
.overlay h1{font-size:30px;margin:10px 0 6px}
.overlay p{opacity:.9;line-height:1.55;margin:6px 0;word-break:keep-all}
.big{font-size:84px}
.btn{display:inline-block;margin:8px 6px;padding:14px 22px;border-radius:999px;border:0;font-size:18px;font-weight:800;cursor:pointer;background:#ffb4c8;color:#222}
.btn.ghost{background:transparent;color:#fff;border:2px solid #fff}
.score{font-size:56px;font-weight:900;color:#ffb4c8;margin:6px 0}
.small{font-size:13px;opacity:.7;margin-top:14px}
.small a{color:#c9b8ff}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="time">⏱ 60</span><span id="score">0점</span><span id="solved">🎧 0개</span><button id="mute" aria-label="소리 켜기">🔇</button></div>
  <div id="info"><span>빨간 곳 <b id="cross">0</b>군데 엉킴</span><button id="reroll">🔄 다른 줄 (-5초)</button></div>
  <div id="wrap"><canvas id="cv"></canvas><div id="msg"></div></div>

  <div class="overlay" id="start">
    <div class="big">🎧</div>
    <h1>줄이어폰 엉킴 풀기</h1>
    <p>요즘 다시 힙해진 <b>줄이어폰</b>.<br>근데 주머니에서 꺼내면… 왜 늘 엉켜있죠?</p>
    <p>동그란 매듭을 끌어서<br><b>빨간 꼬임이 0개</b>가 되게 만들면 성공!<br>60초 동안 최대한 많이 풀어보세요.</p>
    <button class="btn" id="startBtn">탭해서 시작</button>
    <p class="small"><a href="../../../">← 다른 미니게임 보기</a></p>
  </div>

  <div class="overlay hidden" id="result">
    <div class="big" id="rEmoji">🎧</div>
    <h1 id="rTitle">엉킴 장인</h1>
    <div class="score" id="rScore">0점</div>
    <p id="rDetail"></p>
    <div><button class="btn" id="shareBtn">📤 내 점수 공유하기</button></div>
    <div><button class="btn ghost" id="retryBtn">🔁 다시 하기</button></div>
    <p class="small">줄이어폰 리바이벌 기념 원작 미니게임 · <a href="../../../">다른 게임 보기</a></p>
  </div>
  <div id="toast"></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const ROUND=Math.max(1,Math.min(180,Number(qs.get('dur'))||60));
const PLAY_URL=location.origin+location.pathname;
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
let st='ready',score=0,solved=0,level=1,timeLeft=ROUND,lastTs=0,nodes=[],drag=-1,crossSet=new Set(),clearing=false,moves=0,cordColor='#f4f4f4';
const CORDS=['#f4f4f4','#ffd1dc','#bfe3ff','#d6ffb8','#fff1a8','#e2d0ff'];
let muted=true,ac=null;
function beep(f,d=0.08,type='sine',v=0.07){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.stop(ac.currentTime+d+0.02)}catch(e){}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';beep(660)};
function toast(t){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.opacity=0,1800)}
function msg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg._t);msg._t=setTimeout(()=>m.style.opacity=0,700)}
function resize(){
  const r=$('wrap').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);
  const oW=W,oH=H;W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  if(oW&&oH&&nodes.length){nodes.forEach(n=>{n.x=n.x/oW*W;n.y=n.y/oH*H})}
  draw();
}
window.addEventListener('resize',resize);
function hud(){$('time').textContent='⏱ '+Math.ceil(timeLeft);$('score').textContent=score+'점';$('solved').textContent='🎧 '+solved+'개';$('cross').textContent=crossSet.size?countCross():0}
function orient(a,b,c){const v=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);return v>1e-9?1:v<-1e-9?-1:0}
function segX(a,b,c,d){const o1=orient(a,b,c),o2=orient(a,b,d),o3=orient(c,d,a),o4=orient(c,d,b);return o1!==o2&&o3!==o4&&o1!==0&&o2!==0&&o3!==0&&o4!==0}
let crossCount=0;
function computeCross(){
  crossSet=new Set();crossCount=0;
  for(let i=0;i<nodes.length-1;i++)for(let j=i+2;j<nodes.length-1;j++){
    if(segX(nodes[i],nodes[i+1],nodes[j],nodes[j+1])){crossSet.add(i);crossSet.add(j);crossCount++}
  }
  return crossCount;
}
function countCross(){return crossCount}
function genLevel(){
  const n=Math.min(14,4+level);
  const pad=34,minD=46;
  const need=Math.min(2+Math.floor(level*0.8),9);
  let tries=0;
  do{
    nodes=[];
    for(let i=0;i<n;i++){
      let p,k=0;
      do{p={x:pad+Math.random()*(W-2*pad),y:pad+Math.random()*(H-2*pad)};k++}while(k<60&&nodes.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<minD));
      nodes.push(p);
    }
    tries++;
  }while(computeCross()<need&&tries<300);
  if(crossCount===0){ // guarantee at least one tangle
    const t=nodes[1];nodes[1]=nodes[nodes.length-2];nodes[nodes.length-2]=t;computeCross();
  }
  cordColor=CORDS[(level-1)%CORDS.length];
  moves=0;clearing=false;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!nodes.length)return;
  ctx.lineCap='round';ctx.lineJoin='round';
  // shadow
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=9;
  ctx.beginPath();nodes.forEach((n,i)=>i?ctx.lineTo(n.x+2,n.y+3):ctx.moveTo(n.x+2,n.y+3));ctx.stroke();
  for(let i=0;i<nodes.length-1;i++){
    const a=nodes[i],b=nodes[i+1];
    ctx.strokeStyle=crossSet.has(i)?'#ff4d6d':(clearing?'#7dffa8':cordColor);ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // jack (start)
  const j=nodes[0],j2=nodes[1],ang=Math.atan2(j.y-j2.y,j.x-j2.x);
  ctx.save();ctx.translate(j.x,j.y);ctx.rotate(ang);
  ctx.fillStyle='#d9d9e3';ctx.fillRect(-4,-8,22,16);ctx.fillStyle='#b8bac6';ctx.fillRect(18,-3,16,6);ctx.fillStyle='#888';ctx.fillRect(26,-3,2,6);
  ctx.restore();
  // earbuds (end)
  const e=nodes[nodes.length-1],e2=nodes[nodes.length-2],an=Math.atan2(e.y-e2.y,e.x-e2.x);
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(an);
  [[-0.5],[0.5]].forEach(([s])=>{ctx.save();ctx.rotate(s);ctx.strokeStyle=clearing?'#7dffa8':cordColor;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(22,0);ctx.stroke();
    ctx.fillStyle='#fafafa';ctx.beginPath();ctx.arc(30,0,10,0,7);ctx.fill();ctx.fillStyle='#cfcfd8';ctx.beginPath();ctx.arc(33,0,5,0,7);ctx.fill();ctx.restore()});
  ctx.restore();
  // knobs
  nodes.forEach((n,i)=>{
    ctx.fillStyle=i===drag?'#ffd166':'rgba(255,255,255,.95)';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(n.x,n.y,i===drag?15:11,0,7);ctx.fill();ctx.stroke();
  });
}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{
  if(st!=='play'||clearing)return;e.preventDefault();
  const p=pos(e);let bi=-1,bd=40;
  nodes.forEach((n,i)=>{const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<bd){bd=d;bi=i}});
  if(bi>=0){drag=bi;try{cv.setPointerCapture(e.pointerId)}catch(_){};beep(300,0.04);draw()}
});
cv.addEventListener('pointermove',e=>{
  if(drag<0||st!=='play')return;e.preventDefault();
  const p=pos(e);const n=nodes[drag];n.x=Math.max(12,Math.min(W-12,p.x));n.y=Math.max(12,Math.min(H-12,p.y));
  computeCross();hud();draw();
});
function release(){
  if(drag<0)return;drag=-1;moves++;computeCross();hud();draw();
  if(crossCount===0&&st==='play')clear();
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
function clear(){
  if(st!=='play'||clearing)return;
  clearing=true;solved++;
  const n=nodes.length,pts=n*10+Math.max(0,20-moves*2);
  score+=pts;msg('풀었다! +'+pts+' 🎶');beep(660,0.1,'triangle');setTimeout(()=>beep(880,0.12,'triangle'),90);
  hud();draw();
  setTimeout(()=>{if(st!=='play')return;level++;genLevel();hud();draw()},650);
}
$('reroll').addEventListener('click',()=>{if(st!=='play'||clearing)return;timeLeft=Math.max(0.1,timeLeft-5);genLevel();hud();draw();msg('새 줄 꺼냄 (-5초)')});
function loop(ts){
  if(st!=='play')return;
  const dt=Math.min(0.05,(ts-(lastTs||ts))/1000);lastTs=ts;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;hud();end();return}
  $('time').textContent='⏱ '+Math.ceil(timeLeft);
  requestAnimationFrame(loop);
}
function start(){
  score=0;solved=0;level=1;timeLeft=ROUND;lastTs=0;drag=-1;
  $('start').classList.add('hidden');$('result').classList.add('hidden');
  resize();genLevel();st='play';hud();draw();requestAnimationFrame(loop);beep(440);
}
function end(){
  if(st==='over')return;st='over';drag=-1;
  let t,e;
  if(solved>=9){t='엉킴 해체 장인';e='🏆'}else if(solved>=6){t='주머니 정리의 신';e='✨'}else if(solved>=4){t='줄이어폰 고인물';e='🎧'}else if(solved>=2){t='줄이어폰 입문자';e='🙂'}else{t='그냥 무선 쓸게요…';e='😵‍💫'}
  $('rTitle').textContent=t;$('rEmoji').textContent=e;$('rScore').textContent=score+'점';
  $('rDetail').textContent=`${ROUND}초 동안 줄이어폰 ${solved}개를 풀었어요`;
  $('result').classList.remove('hidden');
  window.__lastResult={score,solved};
}
async function share(){
  const text=`🎧 엉킨 줄이어폰 ${ROUND}초에 ${solved}개 풀었다! ${score}점 (${$('rTitle').textContent}) 너는 몇 개?`;
  const full=text+'\n'+PLAY_URL;
  try{if(navigator.share){await navigator.share({title:'줄이어폰 엉킴 풀기',text,url:PLAY_URL});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(full);toast('복사됐어요! 친구에게 붙여넣기 📋')}
  catch(e){const ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();let k=false;try{k=document.execCommand('copy')}catch(_){}ta.remove();toast(k?'복사됐어요! 📋':'주소를 직접 복사해 주세요: '+PLAY_URL)}
}
$('startBtn').addEventListener('click',start);
$('start').addEventListener('click',e=>{if(e.target.tagName!=='A'&&st==='ready')start()});
$('retryBtn').addEventListener('click',start);
$('shareBtn').addEventListener('click',share);
resize();hud();
window.__game={get state(){return st},get score(){return score},get nodes(){return nodes},get cross(){return crossCount},solveNow(){ /* test helper: lay the cord out in a zigzag */ const n=nodes.length;nodes.forEach((p,i)=>{p.x=30+(W-60)*(i/(n-1));p.y=i%2?H*0.4:H*0.6});computeCross();draw();if(crossCount===0&&st==='play')clear();}};
})();
</script>
</body>
</html>
